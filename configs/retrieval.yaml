# Cấu hình pipeline truy hồi (mirret). Đường dẫn tương đối tính từ thư mục gốc repo.
# Biến môi trường MIR_DATA_DIR / MIR_WORK_DIR (nếu có) ghi đè data_dir / work_dir (dùng trên Kaggle).
paths:
  data_dir: "."                          # chứa data/ (query, links) và corpus_out/
  work_dir: "."                          # nơi ghi chunks/, emb/, index/, qtrans/, qemb/, runs/, eval/, submissions/
  corpus: "corpus_out/corpus"            # kết quả `python -m mircrawl merge` (tương đối với data_dir)
  queries: "data/query.parquet"
  links: "data/links_corpus_vi_en_zh.parquet"

seed: 42

chunk:                                   # A + B + C — độ dài tính bằng token BGE-M3 (không tính <s></s>)
  tokenizer: "BAAI/bge-m3"
  parent:                                # A. đoạn nộp (chunk_text): theo cấu trúc, không chồng lấn
    target: 300                          #   gom khối liên tiếp tới khoảng này
    min: 150                             #   đoạn ngắn hơn được gộp tiếp (trừ khi cả bài ngắn hơn)
    max: 400                             #   không vượt (bài <= max → 1 đoạn)
  child:                                 # B. đơn vị tìm kiếm mức mịn, nằm trong từng đoạn cha
    enabled: true
    max: 128
    min: 24                              #   mảnh cuối ngắn hơn → gộp vào mảnh trước
    min_parent: 160                      #   đoạn cha ngắn hơn không chia con (đoạn cha đã đủ mịn)
  ctx:                                   # C. ngữ cảnh ghép vào khi lập chỉ mục (KHÔNG nộp)
    max_chars: 220
    use_section: false                   #   thêm chuyên mục của trang (breadcrumb) — thường là nhiễu, mặc định tắt
  skip_dups: true                        # bỏ tài liệu là bản trùng nội dung (dup_of) — đáp án BTC ghi 1 id mỗi nội dung
  workers: 4
  out_dir: "chunks"                      # chunks/{parents,children}/part-*.parquet

encode:                                  # BGE-M3: dense (CLS, chuẩn hoá) + lexical weights (LSR); ColBERT chỉ khi rerank
  model: "BAAI/bge-m3"
  max_length: 512                        # tính cả <s></s>; đầu vào = ngữ cảnh + "\n" + đoạn
  fp16: true
  batch_tokens: 16384
  max_batch: 128
  block: 100000                          # số đơn vị mỗi khối emb (đơn vị chia việc giữa các máy / GPU)
  out_dir: "emb"                         # emb/{parents,children}/<khối>/{dense.npy, sparse.npz, ids.parquet, _DONE.json}

index:
  out_dir: "index"
  dense:
    flat_below: 200000                   # ít hơn → IndexFlatIP (chính xác); nhiều hơn → IVF + SQ8
    nlist: 16384
    nprobe: 64
    train_size: 500000

bm25:
  k1: 1.5
  b: 0.75
  levels: [parents]                      # đoạn con chứa đúng chữ của đoạn cha → BM25 trên đoạn cha là đủ (thêm children nếu muốn)
  vi_tokenizer: pyvi                     # pyvi (tách từ ghép, chậm) | syllable (tách theo âm tiết, nhanh)
  workers: 4
  index_dir: null                        # mặc định <index>/bm25; đặt đường dẫn để dùng chỉ mục BM25 dựng ở nơi khác

translate:                               # dịch câu hỏi vi → en → zh bằng LLM mở (<= 14B, phát hành trước 1/6/2026)
  models:                                # so sánh; tên ngắn → id Hugging Face
    qwen25_14b: "Qwen/Qwen2.5-14B-Instruct"
    qwen3_8b: "Qwen/Qwen3-8B"            # Qwen3 không có bản 7B; 8B là bản gần nhất
    qwen3_14b: "Qwen/Qwen3-14B"
  use: qwen25_14b                        # bản dịch cho nhánh en/zh = thư mục trong qtrans/ (vd qwen25_14b, qwen3_14b-t2)
  prompt: t2                             # t1 = bản 15/10 (kết quả ở qtrans/<model>); t2 = sửa theo lỗi đã gặp (qtrans/<model>-t2)
  glossary: configs/med_glossary_vi.tsv  # gợi ý thuật ngữ cho t2 (đi kèm mã)
  glossary_max: 10
  thinking: false                        # Qwen3: true = bật chế độ suy nghĩ (chậm hơn nhiều; thử LIMIT nhỏ trước)
  quant: "4bit"                          # 4bit (bitsandbytes) để mỗi GPU T4 chạy một bản model
  batch: 8
  max_new_tokens: 512
  out_dir: "qtrans"                      # qtrans/<tên>/records*.jsonl; qtrans/queries_{vi,en,zh}.parquet

expand:                                  # tài liệu giả do LLM sinh (mirret/expand.py): q2d = Query2Doc, hyde = HyDE
  model: qwen25_14b                      # tên trong translate.models; lượng tử theo translate.quant
  max_new_tokens: 320                    # đoạn ~100–150 từ (zh ~150–200 chữ)
  batch: 8
  bm25_repeat: 3                         # q2d với BM25: câu hỏi lặp n lần + đoạn giả (Query2doc dùng 5 với câu hỏi ngắn)
  out_dir: "qexp"                        # qexp/<mode>-<model>/records*.jsonl ; qexp/<biến thể>/queries_*.parquet

retrieve:
  langs: [vi, en, zh]                    # nhánh ngôn ngữ câu hỏi (vi = câu gốc)
  methods: [dense, lsr, bm25]            # 3 × 3 = 9 nhánh
  levels: [parents, children]            # dense/LSR tìm ở cả hai mức; điểm đoạn con dồn về đoạn cha (RRF trong nhánh)
  depth: 1000                            # số đoạn cha mỗi nhánh
  query_batch: 64
  out_dir: "runs"

fuse:
  rrf_k: 60
  depth: 1000
  configs:                               # tên → danh sách run ("tên*w" = trọng số w)
    rrf9: [vi_dense, vi_lsr, vi_bm25, en_dense, en_lsr, en_bm25, zh_dense, zh_lsr, zh_bm25]
    # BASELINE (19/10/2026): en_lsr, en_bm25 trọng số 0,5 — tốt hơn rrf9 ở doc/unit F2@5–20, cùng dấu ở 2 nửa tập có
    # nhãn (40 câu, nhãn LLM); bỏ hẳn hai nhánh (rrf7) làm giảm Recall@50 → giữ nhưng giảm trọng số
    rrf9_w: [vi_dense, vi_lsr, vi_bm25, en_dense, "en_lsr*0.5", "en_bm25*0.5", zh_dense, zh_lsr, zh_bm25]
    rrf_vi: [vi_dense, vi_lsr, vi_bm25]
    rrf_dense3: [vi_dense, en_dense, zh_dense]
    # Thử nghiệm B1/B2 (20/10): tài liệu giả do LLM sinh, cùng trọng số với rrf9_w (mirret/expand.py)
    q2d9: [q2d_vi_dense, q2d_vi_lsr, q2d_vi_bm25, q2d_en_dense, "q2d_en_lsr*0.5", "q2d_en_bm25*0.5", q2d_zh_dense, q2d_zh_lsr, q2d_zh_bm25]
    hyde9: [hyde_vi_dense, hyde_vi_lsr, hyde_vi_bm25, hyde_en_dense, "hyde_en_lsr*0.5", "hyde_en_bm25*0.5", hyde_zh_dense, hyde_zh_lsr, hyde_zh_bm25]
    q2dlex: [vi_dense, q2d_vi_lsr, q2d_vi_bm25, en_dense, "q2d_en_lsr*0.5", "q2d_en_bm25*0.5", zh_dense, q2d_zh_lsr, q2d_zh_bm25]
    bm25c9: [vi_dense, vi_lsr, bm25c_vi_bm25, en_dense, "en_lsr*0.5", "bm25c_en_bm25*0.5", zh_dense, zh_lsr, bm25c_zh_bm25]
    # B3 (22/10): fusion tuyến tính theo điểm thay RRF, cùng nhánh / trọng số với rrf9_w; α = 0,7; trên 80 câu có nhãn tập 400 ứng viên mất ~10% tài liệu liên quan so với rrf9_w → không dùng
    lin07: {linear: 0.7, runs: [vi_dense, vi_lsr, vi_bm25, en_dense, "en_lsr*0.5", "en_bm25*0.5", zh_dense, zh_lsr, zh_bm25]}
    # lin07 bỏ trọng số 0,5 của en_lsr / en_bm25 (6 nhánh từ khoá ngang nhau) — đề xuất 24/10, kiểm trên LB (bge) so với lin07_cross
    lin07u: {linear: 0.7, runs: [vi_dense, vi_lsr, vi_bm25, en_dense, en_lsr, en_bm25, zh_dense, zh_lsr, zh_bm25]}
    # LB 25/10: lin07u_cross doc F2 0,2453 < 0,2460 (lin07_cross 0,2480) → KHÔNG dùng, giữ trọng số 0,5
    # Sàng lọc tầng 1 (25/10), cộng thêm 9 nhánh vào lin07, cùng trọng số; so doc F2 của <cấu hình>_cross với 0,2480
    lin07prf: {linear: 0.7, runs: [vi_dense, vi_lsr, vi_bm25, en_dense, "en_lsr*0.5", "en_bm25*0.5", zh_dense, zh_lsr, zh_bm25, prf_vi_dense, prf_vi_lsr, prf_vi_bm25, prf_en_dense, "prf_en_lsr*0.5", "prf_en_bm25*0.5", prf_zh_dense, prf_zh_lsr, prf_zh_bm25]}
    lin07rw: {linear: 0.7, runs: [vi_dense, vi_lsr, vi_bm25, en_dense, "en_lsr*0.5", "en_bm25*0.5", zh_dense, zh_lsr, zh_bm25, rw_vi_dense, rw_vi_lsr, rw_vi_bm25, rw_en_dense, "rw_en_lsr*0.5", "rw_en_bm25*0.5", rw_zh_dense, rw_zh_lsr, rw_zh_bm25]}
    # 25/10: đáp án public không có bài PubMed (bỏ hết khỏi bài nộp: recall không đổi, FINAL 0,1804 → 0,1946). Toàn bộ
    # tài liệu en của kho là PubMed: en_bm25 100%, en_lsr ~94% ứng viên là PubMed → bỏ hai nhánh; en_dense (~45% PubMed,
    # còn lại là bài vi/zh) giữ. exclude: pubmed = bỏ bài PubMed khỏi mọi nhánh TRƯỚC khi chuẩn hoá min-max.
    lin07np: {linear: 0.7, exclude: pubmed, runs: [vi_dense, vi_lsr, vi_bm25, en_dense, zh_dense, zh_lsr, zh_bm25]}
    # Q2D bổ sung (không thay thế) vào fusion tuyến tính: 9 nhánh gốc + 9 nhánh q2d cùng trọng số, α = 0,7 (đăng ký trước)
    lin07q: {linear: 0.7, runs: [vi_dense, vi_lsr, vi_bm25, en_dense, "en_lsr*0.5", "en_bm25*0.5", zh_dense, zh_lsr, zh_bm25, q2d_vi_dense, q2d_vi_lsr, q2d_vi_bm25, q2d_en_dense, "q2d_en_lsr*0.5", "q2d_en_bm25*0.5", q2d_zh_dense, q2d_zh_lsr, q2d_zh_bm25]}
    # mE5-large (C, runs_e5: e5_<lang>_dense@parents/@children) — 26/10, công thức lin07 giữ nguyên, chỉ đổi nhóm dense:
    # lin07e5r = thay 3 nhánh dense bge-m3 bằng e5; lin12 = 6 nhánh dense (bge-m3 + e5) cùng trọng số. Kiểm trên LB (bge
    # top-400, cùng điều kiện lin07_cross): doc F2 so với 0,2480, đạt nếu ≥ 0,2520. Cần các file e5 cùng thư mục runs.
    lin07e5r: {linear: 0.7, runs: [e5_vi_dense, vi_lsr, vi_bm25, e5_en_dense, "en_lsr*0.5", "en_bm25*0.5", e5_zh_dense, zh_lsr, zh_bm25]}
    lin12: {linear: 0.7, runs: [vi_dense, vi_lsr, vi_bm25, en_dense, "en_lsr*0.5", "en_bm25*0.5", zh_dense, zh_lsr, zh_bm25, e5_vi_dense, e5_en_dense, e5_zh_dense]}
    # LB 26/10: lin07e5r_cross doc F2 0,1942, lin12_cross 0,2411 < lin07_cross 0,2480 → KHÔNG dùng e5
    # MedCPT (mirret/medcpt.py, 27/10): thêm nhánh dense cho PubMed vào lin07 (lin07m) / lin07u (lin07um, en ×1). Đáp án
    # public không có PubMed → chỉ kiểm được ở vòng private (1–4/11, đáp án làm lại có PubMed).
    lin07m: {linear: 0.7, runs: [vi_dense, vi_lsr, vi_bm25, en_dense, "en_lsr*0.5", "en_bm25*0.5", zh_dense, zh_lsr, zh_bm25, medcpt_en_dense]}
    lin07um: {linear: 0.7, runs: [vi_dense, vi_lsr, vi_bm25, en_dense, en_lsr, en_bm25, zh_dense, zh_lsr, zh_bm25, medcpt_en_dense]}
    # câu hỏi tổng hợp cho fine-tune (mirret/synth.py, k7 MODES=['synth']): cùng công thức lin07 → ứng viên khó như lúc thi
    synth_lin07: {linear: 0.7, runs: [synth_vi_dense, synth_vi_lsr, synth_vi_bm25, synth_en_dense, "synth_en_lsr*0.5", "synth_en_bm25*0.5", synth_zh_dense, synth_zh_lsr, synth_zh_bm25]}

medcpt:                                  # nhánh PubMed bằng MedCPT (mirret/medcpt.py), câu hỏi = bản dịch tiếng Anh
  article_model: "ncbi/MedCPT-Article-Encoder"
  query_model: "ncbi/MedCPT-Query-Encoder"
  max_length: 512                        # cặp [tiêu đề, tóm tắt] như thẻ mô hình
  query_max_length: 64
  batch: 64
  depth: 1000
  out_dir: "emb_medcpt"

rerank:
  method: cross                          # BASELINE: cross (bge-reranker-v2-m3; hơn rrf9 có ý nghĩa, cùng dấu 2 nửa) | colbert
                                         # (multi-vector BGE-M3; không hơn rrf9 trên tập có nhãn)
  cross_model: "BAAI/bge-reranker-v2-m3"
  qwen3_model: "Qwen/Qwen3-Reranker-4B"  # method qwen3 (instruction mặc định của model) | qwen3i (instruction y khoa)
  qwen3_lora: null                       # adapter LoRA của mirret.finetune qwen (k5: QWEN_LORA); null = model gốc
  ft_alpha: 1.0                          # WiSE-FT: 1 = model fine-tune, 0,5 = nửa đường về model gốc (k5: FT_ALPHA)
  qwen3_batch_tokens: 8192               # 4B trên T4 fp16: nhỏ hơn bge để vừa bộ nhớ
  top_n: 400                             # F2 tính theo TẬP → xếp hạng lại chỉ có ích khi top_n > k_chunk
  match_lang: true                       # đoạn zh chấm bằng câu hỏi zh, đoạn en bằng câu en (thiếu bản dịch → câu vi)
  query_max_length: 256
  doc_max_length: 512
  batch_tokens: 16384

submit:
  k_doc: 200                             # tốt nhất trên leaderboard cũ (d200)
  k_chunk: 185                           # tốt nhất cũ (c185); tự giảm nếu file nén vượt max_zip_mb
  doc_agg: max                           # thứ hạng tài liệu: max = đoạn tốt nhất | sum2 / sum3 = tổng điểm 2/3 đoạn tốt nhất
  max_per_doc: 0                         # tối đa n đoạn mỗi tài liệu trong danh sách đoạn (0 = không giới hạn)
  max_zip_mb: 99
  out_dir: "submissions"

eval:
  out_dir: "eval"
  ks: [10, 20, 50, 100, 185, 200]
  rel_threshold: 1                       # nhãn >= 1 là liên quan (báo cáo thêm mức nghiêm >= 2)
  lcs_threshold: 0.4                     # như BTC: LCS token / |đoạn đúng| >= 0,4
  bootstrap: 1000
